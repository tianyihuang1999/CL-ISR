model_kind: transformer
seed: 42
max_length: 512
batch_size: 16
epochs: 50
patience: 5
learning_rate: 2.0e-5
weight_decay: 0.01
warmup_ratio: 0.1
temperature: 0.07
l2_lambda: 1.0e-4
alpha_cl: 1.0
alpha_isr: 1.0
alpha_cls: 1.0
hidden_size: 256
lstm_hidden: 128
dropout: 0.1
encoder_name: roberta-base
augmentation: hybrid
pretrained: true
use_cl: false
use_isr: false
fusion: gated
freeze_isr_backbone: false
num_workers: 0
output_dir: outputs/roberta
train_path: data/sample/train.csv
val_path: data/sample/val.csv
test_path: data/sample/test.csv
