[project]
name = "cl-isr"
version = "0.1.0"
description = "Contrastive Learning and Implicit Stance Reasoning for misleading text detection"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=1.13.1",
  "transformers>=4.21.0",
  "numpy",
  "pandas",
  "scikit-learn",
  "tqdm",
  "pyyaml",
]

[tool.setuptools.packages.find]
where = ["src"]
